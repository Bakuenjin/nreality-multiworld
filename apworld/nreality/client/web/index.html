<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>NReality Multiworld</title><link rel="stylesheet" href="/style.css">
<script src="/ruffle/ruffle.js" defer></script><script src="/app.js" defer></script></head>
<body><main class="layout">
<section class="play" aria-label="Game">
<div id="game" class="game"><div id="setup-panel" class="setup-panel"></div></div>
<p id="status" role="status"></p>
<form id="test-item-form" hidden><input id="test-episode" type="number" min="0" max="199" value="100" required aria-label="Episode"><button type="submit">Test item</button></form>
</section>
<section class="console" aria-label="Console">
<label class="show-others"><input type="checkbox" id="show-others"> Other players' finds</label>
<div id="log" role="log" aria-live="polite"></div>
<form id="command-form"><input id="command-input" autocomplete="off" spellcheck="false" aria-label="Chat or command" placeholder="Chat, !hint, /connect …"><button id="command-send" type="submit">Send</button></form>
</section>
</main></body></html>
